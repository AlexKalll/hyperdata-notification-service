name: CI and production deployment

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build notification service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

  deploy-production:
    name: Deploy notification service
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    concurrency:
      group: hyperdata-production
      cancel-in-progress: false
    steps:
      - name: Configure Netcup SSH
        shell: bash
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "${{ secrets.NETCUP_KNOWN_HOSTS }}" > "$HOME/.ssh/known_hosts"
          printf '%s\n' "${{ secrets.NETCUP_SSH_PRIVATE_KEY }}" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

      - name: Deploy notification service
        env:
          NETCUP_HOST: ${{ secrets.NETCUP_HOST }}
          NETCUP_PORT: ${{ secrets.NETCUP_PORT || '22' }}
          NETCUP_USER: ${{ secrets.NETCUP_USER }}
        run: |
          ssh -p "$NETCUP_PORT" "$NETCUP_USER@$NETCUP_HOST" \
            '/home/deploy/hyperdata/src/hyperdata-backend/deploy/deploy.sh notification'
